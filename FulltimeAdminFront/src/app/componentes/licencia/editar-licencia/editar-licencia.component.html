<div id="titulo" class="titulo-modal">
  <div class="titulo-izquierda">
    <mat-icon id="movilidad">
      workspace_premium
    </mat-icon>

    <span>
      MODIFICAR LICENCIA
    </span>
  </div>

  <button
    type="button"
    class="btn-cerrar-modal"
    (click)="Cancelar(1)"
    matTooltipPosition="left"
    matTooltip="Salir">
    <mat-icon>highlight_off</mat-icon>
  </button>
</div>

<div class="licencia-contenedor">
  <mat-card-content>
    <div class="licencia-card">

      <div class="nota">
        <mat-icon>info</mat-icon>
        <span>
          Por favor modificar los datos requeridos de la licencia y dar clic en Guardar.
        </span>
      </div>

      <form [formGroup]="LicenciaForm" class="licencia-form">

        <div class="form-grid">

          <mat-form-field appearance="outline" class="campo-fecha">
            <mat-label>Fecha Activación</mat-label>

            <mat-icon matPrefix>event_available</mat-icon>

            <input
              matInput
              [matDatepicker]="picker"
              placeholder="dd/mm/aaaa"
              [formControl]="licenciaFechaActivacionForm"
              min="1950-01-31"
              max="2050-01-31"
              required>

            <mat-datepicker-toggle
              matSuffix
              [for]="picker"
              matTooltipPosition="right"
              matTooltip="Indicar la fecha de activación de la licencia.">
            </mat-datepicker-toggle>

            <mat-datepicker touchUi #picker></mat-datepicker>
          </mat-form-field>

          <mat-form-field appearance="outline" class="campo-fecha">
            <mat-label>Fecha Desactivación</mat-label>

            <mat-icon matPrefix>event_busy</mat-icon>

            <input
              matInput
              [matDatepicker]="picker2"
              placeholder="dd/mm/aaaa"
              [formControl]="licenciaFechaDesactivacionForm"
              min="1950-01-31"
              max="2050-01-31"
              required>

            <mat-datepicker-toggle
              matSuffix
              [for]="picker2"
              matTooltipPosition="right"
              matTooltip="Indicar la fecha de finalización de la licencia.">
            </mat-datepicker-toggle>

            <mat-datepicker touchUi #picker2></mat-datepicker>
          </mat-form-field>

        </div>

        <mat-form-field appearance="outline" class="campo-estado">
          <mat-label>Estado</mat-label>

          <mat-icon matPrefix>toggle_on</mat-icon>

          <mat-select [formControl]="licenciaEstadoForm" required>
            <mat-option *ngFor="let item of estados" [value]="item.estado">
              {{ item.nombre }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="campo-observacion">
          <mat-label>Observación</mat-label>

          <mat-icon
            matPrefix
            matTooltipPosition="right"
            matTooltip="Observación adicional de la licencia. Máximo 300 caracteres.">
            speaker_notes
          </mat-icon>

          <textarea
            matInput
            rows="4"
            maxlength="300"
            placeholder="Ingrese una observación relacionada con la licencia."
            [formControl]="licenciaObservacionForm">
          </textarea>

          <mat-hint align="end">
            {{ licenciaObservacionForm.value?.length || 0 }}/300
          </mat-hint>
        </mat-form-field>

      </form>

    </div>
  </mat-card-content>

  <div class="acciones">
    <button
      id="btn-raised"
      class="btn btn-sm"
      type="button"
      [disabled]="LicenciaForm.invalid"
      (click)="ValidarDatosLicencia()">
      <mat-icon>save</mat-icon>
      Guardar
    </button>
  </div>
</div>
