<mat-sidenav-container class="sidenav-container">

  <mat-sidenav #drawer class="sidenav mat-elevation-z8" fixedInViewport
    [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'" [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="(isHandset$ | async) === false">

    <!-- LOGO -->
    <div class="sidebar-header">
      <div class="logo-box">
        <img src="../../../assets/imagenes/logo/LOGO.png" id="logo" alt="Full Time">
      </div>
      <h3>Administración</h3>
      <p>Panel de control</p>
    </div>

    <!-- MENÚ -->
    <div class="menu-contenedor">

      <div class="menu-grupo">

        <div class="menu-grupo-header">
          <mat-icon>business</mat-icon>
          <span>Gestión</span>
        </div>

        <div class="menu-items">

          <button type="button" class="menu-item" *ngFor="let item of menuItems" [ngClass]="{
              active: item.name === nombreSelect,
              disabled: !item.activo
            }" (click)="navegar(item, drawer)">

            <span class="menu-icon-wrapper">
              <mat-icon class="menu-item-icon">
                {{ item.icono }}
              </mat-icon>
            </span>

            <span class="menu-item-text">
              {{ item.name }}
            </span>

          </button>

        </div>

      </div>

    </div>

  </mat-sidenav>

  <mat-sidenav-content class="contenido-principal">

    <!-- TOOLBAR -->
    <mat-toolbar class="toolbar-admin">

      <!-- NAV PARA PANTALLAS GRANDES -->
      <mat-toolbar-row *ngIf="!barraInicial; else ShowNavbar" class="toolbar-row">

        <div class="toolbar-title">
          <h2>Fulltime Web 4.0</h2>
          <span>Sistema de administración</span>
        </div>

        <div class="toolbar-actions">

          <button mat-mini-fab class="btn-toolbar btn-home" (click)="irHome()" matTooltip="Ir inicio"
            matTooltipPosition="below">
            <mat-icon>home</mat-icon>
          </button>

          <button mat-mini-fab class="btn-toolbar btn-logout" (click)="cerrarSesion()" matTooltip="Cerrar sesión"
            matTooltipPosition="below">
            <mat-icon>logout</mat-icon>
          </button>

        </div>

      </mat-toolbar-row>

      <!-- NAV PARA CELULARES O PANTALLA PEQUEÑA -->
      <ng-template #ShowNavbar>

        <mat-toolbar-row class="toolbar-row">

          <button type="button" aria-label="Toggle sidenav" mat-icon-button class="btn-menu-mobile"
            (click)="drawer.toggle()" *ngIf="isHandset$ | async">

            <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>

          </button>

          <div class="toolbar-title mobile-title">
            <h2>Full Time</h2>
          </div>

          <div class="toolbar-actions">

            <button mat-mini-fab class="btn-toolbar btn-home" (click)="irHome()" matTooltip="Ir inicio"
              matTooltipPosition="below">
              <mat-icon>home</mat-icon>
            </button>

            <button mat-mini-fab class="btn-toolbar btn-logout" (click)="cerrarSesion()" matTooltip="Cerrar sesión"
              matTooltipPosition="below">
              <mat-icon>logout</mat-icon>
            </button>

          </div>

        </mat-toolbar-row>

      </ng-template>

    </mat-toolbar>

    <!-- CONTENIDO -->
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>

  </mat-sidenav-content>

</mat-sidenav-container>
